[metadata]
name = recurkeep
version = 0.1.0
description = Workflow-aware recurrent checkpoint allocation for hybrid LLM serving
long_description = file: README.md
long_description_content_type = text/markdown

[options]
packages = find:
python_requires = >=3.10
include_package_data = True

[options.packages.find]
include =
    recurkeep
    recurkeep.*
    experiments
    experiments.*

[options.package_data]
recurkeep = profiles/*.csv, profiles/*.json

[options.extras_require]
test = pytest>=7,<9
