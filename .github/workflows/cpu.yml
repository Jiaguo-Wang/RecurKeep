name: CPU quickstart

on: [push, pull_request]

permissions:
  contents: read

jobs:
  quickstart:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run bundled CPU example
        run: python3 examples/plan.py
      - name: Run dependency-free contract tests
        run: python3 -m unittest tests.test_release_contract tests.test_strict_control -v
